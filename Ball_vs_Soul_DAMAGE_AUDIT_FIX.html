A.chains=function(m,f){m.s.kingChain=1.6;m.s.kingTarget=f;txt(m.x,m.y-42,'CHAINS','#6e6e9c');boom(m.x,m.y,'#6e6e9c',12)};
A.task=function(m,f){const a=ang(m,f);zn.push({o:m,k:'tasklane',x:m.x,y:m.y,r:72,t:4,a,c:'#8ff0ff33'});m.s.taskA=a;m.s.taskT=4;txt(m.x,m.y-42,'TASK ASSIGNMENT','#8ff0ff');boom(m.x,m.y,'#8ff0ff',14)};
A.seamcut=function(m,f){const ts=zn.filter(z=>z.o===m&&z.k==='thread'&&z.t>0);if(ts.length){ts.forEach(z=>{z.t=.01;boom(z.x,z.y,'#b58cff',7)});SRC=[m,'a'];hurt(f,Math.min(15,ts.length*3));const a=ang(m,f);f.vx+=Math.cos(a)*Math.min(520,ts.length*70);f.vy+=Math.sin(a)*Math.min(520,ts.length*70);txt(m.x,m.y-42,'CUT ×'+ts.length,'#b58cff')}else{const near=zn.filter(z=>z.o===m&&z.k==='thread'&&z.t>0);if(near.length>=2){near[0].link=near[1];near[1].link=near[0];txt(m.x,m.y-42,'RE-STITCH','#b58cff')}else{txt(m.x,m.y-42,'NO THREAD','#b58cff');m.cd=1.2}}};

/* Final physics hooks. */
const _finCh2=ch2,_finPas=pas,_finHurt=hurt,_finWh2=wh2;
ch2=function(a,b){const r=_finCh2(a,b),id=a.b.id,now=performance.now()/1000;if(id==='drill'&&a.s.drill>0){a.s.drillHits=(a.s.drillHits||0)+1;if(a.s.drillHits===1){SRC=[a,'c'];hurt(b,14)}else if(a.s.drillHits===2){SRC=[a,'c'];hurt(b,7);a.s.drill=0}}if(id==='chain'){if(a.s.wallTime&&now-a.s.wallTime<=1.1){SRC=[a,'c'];hurt(b,8);b.vx*=1.45;b.vy*=1.45}a.s.wallTime=0}if(id==='toxic'){zn.filter(z=>z.o===a&&z.k==='toxic').forEach(z=>z.t=.01);zn.push({o:a,k:'toxic',x:b.x,y:b.y,r:34,t:1.8,hit:0,c:'#72d66b55'})}if(id==='rubber'&&a.s.bounceArmed){b.vx*=1.25;b.vy*=1.25;a.s.bounceArmed=0}if(id==='king'&&a.s.kingChain>0){SRC=[a,'c'];hurt(b,12);const aa=ang(a,b);b.vx+=Math.cos(aa)*380;b.vy+=Math.sin(aa)*380}if(id==='chara')a.s.love=Math.min(100,(a.s.love||0)+12);if(id==='souleater')a.s.soulMeter=Math.min(100,(a.s.soulMeter||0)+18);return r};
wh2=function(b){const r=_finWh2(b),id=b.b.id;if(id==='chain')b.s.wallTime=performance.now()/1000;if(id==='mewmew')b.s.face=((b.s.face||0)+1)%3;if(id==='error')b.s.frameMomentum=[b.vx,b.vy];if(id==='forgotten')b.s.anchor={x:b.x,y:b.y};if(id==='sweetcakes')b.s.rhythm=Math.min(3,(b.s.rhythm||0)+1);if(id==='seam'&&zn.filter(z=>z.o===b&&z.k==='thread'&&z.t>0).length<16)zn.push({o:b,k:'thread',x:b.x,y:b.y,r:8,t:2.2,c:'#b58cff88'});return r};
hurt=function(t,d,o={}){const src=SRC&&SRC[0];/* Attacker bonuses only here; defender reductions/evasion remain in the existing hurt pipeline and run once. */if(src&&src.b&&src.b.id==='glass'&&SRC[1]==='c')d*=1+(src.s.fracture||0)*.06;if(src&&src.b&&src.b.id==='chara'&&SRC[1]==='c')d*=1+(src.s.love>=75?.16:src.s.love>=50?.11:src.s.love>=25?.06:0);if(src&&src.b&&src.b.id==='souleater'&&SRC[1]==='c'&&src.s.nextContactBonus){d+=src.s.nextContactBonus;src.s.nextContactBonus=0}return _finHurt(t,d,o)};
pas=function(b,dt){_finPas(b,dt);const id=b.b.id,o=b===P?E:P;if(id==='glass'){b.s.fracture=b.hp/b.mh<=.333?2:b.hp/b.mh<=.666?1:0;const target=b.b.sp*1.8*(1+b.s.fracture*.04),v=Math.hypot(b.vx,b.vy);if(v>0&&v<target){const f=Math.min(.006,(target/v-1)*dt*4);b.vx*=1+f;b.vy*=1+f}}if(id==='drill'&&b.s.drill>0){b.s.drill-=dt;if(b.s.drill<=0){b.vx*=.42;b.vy*=.42}}if(id==='chain'&&b.s.chainT>0&&b.s.chainTarget){b.s.chainT-=dt;const f=b.s.chainTarget;if(Math.hypot(f.x-b.x,f.y-b.y)>170){const aa=Math.atan2(b.y-f.y,b.x-f.x);f.vx+=Math.cos(aa)*220*dt;f.vy+=Math.sin(aa)*220*dt}}if(id==='monsterkid'&&b.s.recover>0){b.s.recover-=dt;b.vx*=.985;b.vy*=.985}if(id==='mewmew'&&b.s.spin>0){b.s.spin-=dt;if(Math.hypot(o.x-b.x,o.y-b.y)<100&&R()<dt*8){SRC=[b,'a'];hurt(o,5)}}if(id==='toxic'){for(const z of zn){if(z.o!==b||z.k!=='toxic'||z.t<=0)continue;z.t-=dt;z.hit=(z.hit||0)-dt;if(z.hit<=0&&Math.hypot(o.x-z.x,o.y-z.y)<o.r+z.r){z.hit=.8;SRC=[b,'a'];hurt(o,5);o.s.slow=Math.max(o.s.slow||0,.8);o.vx*=.9;o.vy*=.9;txt(o.x,o.y-30,'CONTAMINATED','#72d66b')}}}if(id==='noelle'&&b.s.snowTrigger){b.s.snowCharge=Math.min(100,(b.s.snowCharge||0)+dt*55);if(b.s.snowCharge>=100&&!b.s.snowUsed){b.s.snowUsed=1;b.s.snowTrigger=0;SRC=[b,'a'];shoot(b,b.x,b.y,ang(b,o),250,22,'#e8f8ff',16,{freeze:1,snowgrave:1},2.5);txt(b.x,b.y-42,'SNOWGRAVE','#e8f8ff');boom(b.x,b.y,'#e8f8ff',20)}}if(id==='king'&&b.s.kingChain>0)b.s.kingChain-=dt;if(id==='tasquemanager'&&b.s.taskT>0)b.s.taskT-=dt;if(id==='sweetcakes'&&(b.s.rhythm||0)>0)b.s.rhythm=Math.max(0,b.s.rhythm-dt*.25);if(id==='gravitycore'&&b.s.gravityFlip>0){b.s.gravityFlip-=dt;const dx=W/2-b.x,dy=H/2-b.y,d=Math.hypot(dx,dy)||1;b.vx+=dx/d*180*dt;b.vy+=dy/d*180*dt}if(id==='souleater'&&b.s.soulMeter>0)b.s.soulMeter=Math.max(0,b.s.soulMeter-dt*1.5);if(id==='forgotten'&&b.s.forget>0)b.s.forget-=dt};

/* Extend the existing state-bar system. */
const _finStateBar=drawStateBar;drawStateBar=function(c,b){_finStateBar(c,b);if(!b||!b.b)return;const id=b.b.id;let label='',value=0,max=0,col=b.b.c||'#fff';if(id==='rubber'){label='ELASTIC';value=b.s.elastic||0;max=100;col='#ff9b9b'}else if(id==='chara'){label='LOVE';value=b.s.love||0;max=100;col='#ff4444'}else if(id==='souleater'){label='SOUL';value=b.s.soulMeter||0;max=100;col='#d8f2ff'}else if(id==='sweetcakes'){label='RHYTHM';value=b.s.rhythm||0;max=3;col='#ff8ac8'}else if(id==='seam'){label='THREAD';value=Math.min(16,zn.filter(z=>z.o===b&&z.k==='thread'&&z.t>0).length);max=16;col='#b58cff'}else if(id==='noelle'){label='SNOWGRAVE';value=b.s.snowCharge||0;max=100;col='#c7f1ff'}else if(id==='glass'){label='CRACK';value=b.s.fracture||0;max=2;col='#dff'}else return;const y=b.y+b.r+34;c.fillStyle='#000b';c.fillRect(b.x-45,y,90,7);c.fillStyle=col;c.fillRect(b.x-45,y,90*Math.max(0,Math.min(max,value))/max,7);c.strokeStyle='#fff8';c.strokeRect(b.x-45,y,90,7);c.fillStyle=col;c.font='bold 9px sans-serif';c.textAlign='center';c.fillText(label+' '+Math.floor(value)+'/'+max,b.x,y+18)};

const _finOkc=okc;okc=function(b,f){const id=b.b.id;if(id==='purge')return zn.some(z=>z.o===b&&z.k==='toxic'&&z.t>0);if(id==='reversepulse')return b.s.impactA!=null;if(id==='bounceback')return (b.s.elastic||0)>=40;if(id==='inmyway')return !!b.s.lastHurt;if(id==='frameshift')return !!b.s.frameMomentum;if(id==='devour')return (b.s.soulMeter||0)>=25;if(id==='remember')return true;return _finOkc(b,f)};

/* Preview seeds the new resource mechanics so previews remain meaningful and isolated. */
const _finPrev=prev;prev=function(id,i){_finPrev(id,i);if(!P)return;if(id==='rubber')P.s.elastic=90;if(id==='reversepulse'){P.s.impactA=0;P.s.impactStrength=850}if(id==='purge'){zn.push({o:P,k:'toxic',x:P.x+50,y:P.y,r:30,t:2,hit:0,c:'#72d66b55'})}if(id==='inmyway')P.s.lastHurt=E;if(id==='seamcut'){zn.push({o:P,k:'thread',x:P.x+40,y:P.y,r:8,t:2,c:'#b58cff88'});zn.push({o:P,k:'thread',x:P.x+90,y:P.y+50,r:8,t:2,c:'#b58cff88'})}if(id==='devour')P.s.soulMeter=70;if(id==='remember')P.s.anchor={x:P.x-80,y:P.y};if(id==='chara')P.s.love=75;if(id==='noelle'){P.s.snowTrigger=1;P.s.snowCharge=75}};


/* DAMAGE AUDIT FIX — unify contact damage and prevent duplicate defender reductions. */
/* COMBAT VFX OVERHAUL — VISUAL-ONLY LAYER. */
const BVS_VFX_EXEMPT=new Set(['gaster','sans','orbitron','marionette','undyne','papyrus']);
let BVS_VFX=[];
const BVS_VFX_PALETTE={fire:'#ff7548',ice:'#9cecff',heal:'#8cffc0',shield:'#b9e8ff',magic:'#c6a0ff',dark:'#a5a0ff',metal:'#ffe09a',poison:'#91ef7c',chaos:'#ff7fe8',physical:'#ffffff'};
function bvsVfxStyle(ab){
 const a=String(ab||'').toLowerCase();
 if(/heal|mend|spare|mercy|brainfeast|devour|soul|feast/.test(a))return 'heal';
 if(/shield|guard|mirror|protect|bounceback|defend|anchor/.test(a))return 'shield';
 if(/ice|freeze|snow|frost/.test(a))return 'ice';
 if(/fire|burn|flame|ember|hell|inferno/.test(a))return 'fire';
 if(/poison|toxic|venom|web|spider|trap|mine|cauldron|thread|grave|ghost|zone|plant|rule|task/.test(a))return 'zone';
 if(/laser|beam|blaster|spear|shot|bigshot|project|screech|pulse|reap|losthead|arrow/.test(a))return 'aim';
 if(/dash|hop|axe|charge|lunge|flip|drill|rush|strike|sword|spin|ride|frame/.test(a))return 'motion';
 if(/gravity|magnet|orbit|pull|chain|tether|force|wind/.test(a))return 'control';
 if(/glitch|error|chaos|jevil|random|rift|copy|mimic|void|forget|remember|phase/.test(a))return 'chaos';
 return 'arcane';
}
function bvsVfxCast(m,f,ab){
 if(!m||!m.b||BVS_VFX_EXEMPT.has(m.b.id))return;
 const style=bvsVfxStyle(ab),col=m.b.c||'#9eeaff';
 BVS_VFX.push({x:m.x,y:m.y,tx:f&&Number.isFinite(f.x)?f.x:m.x+Math.cos(m.aim||0)*120,ty:f&&Number.isFinite(f.y)?f.y:m.y+Math.sin(m.aim||0)*120,col,style,age:0,dur:style==='aim'?.9:.72,seed:(String(ab||'').length*17+(m.side||0)*31)%97});
 if(BVS_VFX.length>28)BVS_VFX.splice(0,BVS_VFX.length-28);
}
function bvsVfxRender(dt){
 if(!BVS_VFX.length||!cx)return;
 const c=cx;
 c.save();
 // Match the arena's world-coordinate transform; the overlay is visual only.
 c.setTransform(sc,0,0,sc,ox,oy+HB*sc);
 for(const v of BVS_VFX){
  v.age+=dt;const p=Math.max(0,1-v.age/v.dur),q=v.age/v.dur;
  if(p<=0)continue;
  const x=v.x,y=v.y,dx=v.tx-x,dy=v.ty-y,len=Math.hypot(dx,dy)||1,a=Math.atan2(dy,dx),r=26+q*78;
  c.save();c.globalAlpha=p;
  // Layered shock rings make the activation readable even on a busy arena.
  c.lineWidth=3;c.strokeStyle=v.col;c.shadowColor=v.col;c.shadowBlur=16;
  c.beginPath();c.arc(x,y,r,0,Math.PI*2);c.stroke();
  c.globalAlpha=p*.48;c.lineWidth=1.5;c.beginPath();c.arc(x,y,r*.68,-q*4,q*4+Math.PI*1.5);c.stroke();c.shadowBlur=0;
  if(v.style==='aim'){
   c.globalAlpha=p*.52;c.setLineDash([10,7]);c.lineWidth=2;c.beginPath();c.moveTo(x,y);c.lineTo(v.tx,v.ty);c.stroke();c.setLineDash([]);
   const hx=x+Math.cos(a)*Math.min(len,Math.max(35,len*q)),hy=y+Math.sin(a)*Math.min(len,Math.max(35,len*q));
   c.globalAlpha=p;c.fillStyle=v.col;c.beginPath();c.moveTo(hx+Math.cos(a)*10,hy+Math.sin(a)*10);c.lineTo(hx+Math.cos(a+2.45)*8,hy+Math.sin(a+2.45)*8);c.lineTo(hx+Math.cos(a-2.45)*8,hy+Math.sin(a-2.45)*8);c.closePath();c.fill();
  }else if(v.style==='motion'){
   c.globalAlpha=p*.75;c.lineWidth=5;c.beginPath();c.moveTo(x-Math.cos(a)*r*.35,y-Math.sin(a)*r*.35);c.lineTo(x+Math.cos(a)*r*1.4,y+Math.sin(a)*r*1.4);c.stroke();
   for(let j=0;j<3;j++){const aa=a+(j-1)*.22;c.globalAlpha=p*(.7-j*.15);c.beginPath();c.arc(x+Math.cos(aa)*r*.55,y+Math.sin(aa)*r*.55,4-j*.6,0,Math.PI*2);c.fillStyle=v.col;c.fill()}
  }else if(v.style==='heal'){
   c.globalAlpha=p*.8;c.strokeStyle=BVS_VFX_PALETTE.heal;c.lineWidth=3;
   for(let j=0;j<4;j++){const yy=y-r*.6+j*r*.4;c.beginPath();c.moveTo(x-r*.12,yy);c.lineTo(x+r*.12,yy);c.moveTo(x,yy-r*.12);c.lineTo(x,yy+r*.12);c.stroke()}
   c.beginPath();c.arc(x,y,r*.48,0,Math.PI*2);c.stroke();
  }else if(v.style==='shield'){
   c.globalAlpha=p*.75;c.lineWidth=3;c.beginPath();for(let j=0;j<6;j++){const aa=j*Math.PI/3-Math.PI/6,xx=x+Math.cos(aa)*r*.78,yy=y+Math.sin(aa)*r*.78;j?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.closePath();c.stroke();
  }else if(v.style==='ice'){
   c.globalAlpha=p*.8;c.lineWidth=2.5;for(let j=0;j<6;j++){const aa=j*Math.PI/3+q;const ex=x+Math.cos(aa)*r,ey=y+Math.sin(aa)*r;c.beginPath();c.moveTo(x,y);c.lineTo(ex,ey);c.lineTo(ex-Math.cos(aa-.65)*10,ey-Math.sin(aa-.65)*10);c.moveTo(ex,ey);c.lineTo(ex-Math.cos(aa+.65)*10,ey-Math.sin(aa+.65)*10);c.stroke()}
  }else if(v.style==='fire'){
   c.globalAlpha=p*.7;for(let j=0;j<9;j++){const aa=j*2.399+v.seed,rr=r*(.35+((j%3)/4));const xx=x+Math.cos(aa)*rr,yy=y+Math.sin(aa)*rr;c.fillStyle=j%2?'#fff0ad':v.col;c.beginPath();c.moveTo(xx,yy-7*p);c.lineTo(xx+4*p,yy+4*p);c.lineTo(xx-4*p,yy+4*p);c.closePath();c.fill()}
  }else if(v.style==='zone'||v.style==='control'){
   c.globalAlpha=p*.7;c.lineWidth=2;c.setLineDash([5,5]);c.beginPath();for(let j=0;j<8;j++){const aa=j*Math.PI/4+q*.8,rr=r*(j%2?.72:1);const xx=x+Math.cos(aa)*rr,yy=y+Math.sin(aa)*rr;j?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.closePath();c.stroke();c.setLineDash([]);
  }else{
   c.globalAlpha=p*.8;c.lineWidth=2.5;c.beginPath();for(let j=0;j<8;j++){const aa=j*Math.PI/4+q*2,rr=j%2?r*.45:r*.82,xx=x+Math.cos(aa)*rr,yy=y+Math.sin(aa)*rr;j?c.lineTo(xx,yy):c.moveTo(xx,yy)}c.closePath();c.stroke();
  }
  // Small orbiting motes, bounded to keep mobile performance stable.
  c.globalAlpha=p*.85;c.fillStyle=v.col;
  for(let j=0;j<6;j++){const aa=j*Math.PI/3+q*5+v.seed,rr=r*(.72+(j%2)*.16);c.beginPath();c.arc(x+Math.cos(aa)*rr,y+Math.sin(aa)*rr,2.1,0,Math.PI*2);c.fill()}
  c.restore();
 }
 BVS_VFX=BVS_VFX.filter(v=>v.age<v.dur);
 // Add restrained glow streaks to ordinary ability projectiles; the six protected balls are untouched.
 for(const p of pj){if(!p||!p.o||!p.o.b||BVS_VFX_EXEMPT.has(p.o.b.id)||p.wait>0)continue;c.save();c.globalAlpha=.25;c.strokeStyle=p.c||p.o.b.c||'#fff';c.lineWidth=Math.max(2,p.r*.8);c.shadowColor=c.strokeStyle;c.shadowBlur=10;c.beginPath();c.moveTo(p.x-p.vx*.055,p.y-p.vy*.055);c.lineTo(p.x,p.y);c.stroke();c.restore()}
 c.restore();
}
const BVS_baseUse=use;
use=function(m,f){const id=m&&m.b&&m.b.id,ab=m&&m.b&&m.b.ab,allowed=!!(m&&m.b&&A[ab]&&m.cd<=0&&(ph==='fight'||ph==='prev')&&!(m.s&&m.s.stun>0));BVS_baseUse(m,f);if(allowed)bvsVfxCast(m,f,ab)};
const BVS_baseDraw=draw;
draw=function(dt){BVS_baseDraw(dt);if(ph==='fight'||ph==='prev'||ph==='end'||ph==='cd')bvsVfxRender(dt)};
const BVS_baseHurt=hurt;
hurt=function(t,d,o={}){const src=SRC&&SRC[0],srcId=src&&src.b&&src.b.id,targetId=t&&t.b&&t.b.id,x=t&&t.x,y=t&&t.y,col=src&&src.b&&src.b.c;const dealt=BVS_baseHurt(t,d,o);if(dealt>0&&src&&src!==t&&!BVS_VFX_EXEMPT.has(srcId)&&!BVS_VFX_EXEMPT.has(targetId)){BVS_VFX.push({x,y,tx:x,ty:y,col:col||'#fff',style:'hit',age:0,dur:.38,seed:dealt|0});if(BVS_VFX.length>28)BVS_VFX.shift()}return dealt};

menu();chk();
